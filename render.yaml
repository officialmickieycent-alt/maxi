services:
  - type: web
    name: fx-positioning-intel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn Positioning:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/status
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: fx_intel